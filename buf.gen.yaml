version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/torrefatto/holism/api
plugins:
  - remote: buf.build/protocolbuffers/go
    out: api
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: api
    opt: paths=source_relative
  - remote: buf.build/bufbuild/validate-go
    out: api
    opt: paths=source_relative
